name: Update YouTube Videos

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/update-videos.yml'

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install yt-dlp and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq
          pip3 install --user yt-dlp
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fetch latest videos from YouTube channel
        env:
          CHANNEL_URL: "https://www.youtube.com/@dreamtoabroad13918"
        run: |
          yt-dlp --flat-playlist --dump-json "${CHANNEL_URL}" | jq -r '[.id, .title] | @tsv' | head -n 15 > /tmp/ytlist.txt || true
          echo '{"generated": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "videos": [' > /tmp/videos.json
          first=true
          while IFS=$'\t' read -r id title; do
            if [ "$first" = true ]; then first=false; else echo ',' >> /tmp/videos.json; fi
            thumb="https://i.ytimg.com/vi/${id}/hqdefault.jpg"
          
            esc_title=${esc_title#\"}
            esc_title=${esc_title%\"}
            printf '{"id":"%s","title":"%s","thumb":"%s"}' "$id" "$esc_title" "$thumb" >> /tmp/videos.json
          done < /tmp/ytlist.txt
          echo ']}' >> /tmp/videos.json
          cat /tmp/videos.json
          mkdir -p assets
          mv /tmp/videos.json assets/videos.json

      - name: Commit & push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/videos.json
          git commit -m "chore: update youtube videos list" || echo 'no changes to commit'
          git push origin HEAD:main || true
